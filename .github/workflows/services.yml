name: Services

on:
  pull_request:
    paths:
      - 'services/**'
      - 'packages/db/**'
      - 'packages/deployment/**'
      - 'packages/devnet/**'
      - 'clients/typescript/**'
      - 'programs/laterite/**'
      - '.railway/**'
      - '.dockerignore'
      - 'justfile'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/services.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The Postgres Railway runs, as `just db-up` pins it.
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          install-rust: 'false'
          install-solana: 'false'
          install-solana-verify: 'false'
          install-anchor: 'false'
      - name: Check the migrations against the schema
        run: just db-check
      - name: Migrate the empty database, then migrate it again
        run: just db-migrate && just db-migrate
      - name: Test the schema
        run: pnpm --filter @laterite/db test

  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Test the services against a local validator
        run: just services-test
      - name: Build the image Railway runs
        run: just operator-image
