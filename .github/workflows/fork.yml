name: Fork

on:
  pull_request:
    paths:
      - 'programs/laterite/**'
      - 'clients/typescript/**'
      - 'packages/deployment/**'
      - 'packages/devnet/src/**'
      - 'tests/fork/**'
      - 'runbooks/**'
      - 'txtx.yml'
      - 'justfile'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/fork.yml'
  push:
    branches: [main]
  # Routes, pools and Kamino Scope's feed list change on mainnet without a change here.
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mainnet-fork:
    # Pull requests from forks get no secrets: the suite needs the Pyth Pro token for its USDT sweep.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          install-surfpool: 'true'
      - name: Run the mainnet-fork suite
        env:
          SURFPOOL_DATASOURCE_RPC_URL: ${{ secrets.SURFPOOL_DATASOURCE_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          PYTH_PRO_ACCESS_TOKEN: ${{ secrets.PYTH_PRO_ACCESS_TOKEN }}
        run: just test-fork
      - name: Upload the measurements and the trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-reports
          path: tests/fork/reports/
          if-no-files-found: ignore
