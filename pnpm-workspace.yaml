packages:
  - 'apps/*'
  - 'clients/*'
  - 'packages/*'
  - 'services/*'
  - 'tests/*'

allowBuilds:
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@solana-program/record@0.5.0'
  - '@solana-program/system@0.15.0'
  - '@solana-program/token-2022@0.19.0'
  - '@solana-program/token@0.17.0'

overrides:
  # drizzle-kit's @esbuild-kit loader pins esbuild 0.18, below the fix for GHSA-67mh-4wv8-2f99
  '@esbuild-kit/core-utils>esbuild': 0.25.12

peerDependencyRules:
  allowedVersions:
    '@solana/kit': '8'
    '@solana/kit-plugin-rpc': '0.19'

audit:
  # Advisories reviewed and accepted by GHSA id, each with a comment on why it cannot reach the product.
  ignore: []
